<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Questionnaire</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="container">
    <h1>Questionnaire</h1>
    <div id="questions"></div>

    <div class="actions">
      <button id="submit-btn" class="btn">Terminer (les réponses ne sont pas envoyées)</button>
      <button id="export-btn" class="btn ghost">Télécharger mes réponses (JSON)</button>
      <a class="btn ghost" href="index.html">Retour</a>
    </div>

    <div id="thanks" class="hidden">
      <h2>Merci !</h2>
      <p>Tes réponses sont restées sur ton appareil. Tu peux les télécharger si tu veux.</p>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    (async function(){
      const questions = await App.loadQuestions();
      App.renderQuestionnaire('questions', questions);

      document.getElementById('submit-btn').addEventListener('click', () => {
        document.getElementById('thanks').classList.remove('hidden');
      });

      document.getElementById('export-btn').addEventListener('click', () => {
        const answers = App.collectAnswers('questions');
        const blob = new Blob([JSON.stringify(answers, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'mes-reponses.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });
    })();
  </script>
</body>
</html>
